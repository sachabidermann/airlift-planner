name: checks

on:
  push:
  pull_request:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Unit tests and browser-model parity (no network data needed)
        run: sh scripts/check.sh --offline
